name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=90

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        working-directory: frontend
        run: node --test

  package:
    name: package
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install it somewhere clean and use it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/changerisk --version
          /tmp/clean/bin/changerisk rules | wc -l
          /tmp/clean/bin/python - <<'PY'
          from changerisk.webassets import web_dir
          root = web_dir()
          assert (root / "index.html").is_file(), root
          print("dashboard files found in", root)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
