name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest --cov --cov-report=term-missing:skip-covered --cov-fail-under=90

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        working-directory: frontend
        run: node --test

  container:
    name: container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t changerisk .
      - name: Run it and use it
        run: |
          docker run -d --name cr -p 7860:7860 changerisk
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7860/api/health >/dev/null && break || sleep 1; done
          curl -fsS http://127.0.0.1:7860/api/health | grep -q '"hosted": true'
          python3 - <<'PY'
          import json, urllib.request
          diff = "diff --git a/config/production.yml b/config/production.yml\n--- a/config/production.yml\n+++ b/config/production.yml\n@@ -1 +1 @@\n-debug: false\n+debug: true\n"
          req = urllib.request.Request(
              "http://127.0.0.1:7860/api/analyze",
              data=json.dumps({"source": {"type": "diff", "text": diff}}).encode(),
              headers={"Content-Type": "application/json"},
          )
          report = json.load(urllib.request.urlopen(req, timeout=30))
          assert report["level"] in ("moderate", "high", "critical"), report["level"]
          assert any(f["rule"] == "CFG002" for f in report["findings"])
          print("analysed in the container:", report["score"], report["level"])
          PY
      - name: Container logs
        if: always()
        run: docker logs cr

  package:
    name: package
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install it somewhere clean and use it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/changerisk --version
          /tmp/clean/bin/changerisk rules | wc -l
          /tmp/clean/bin/python - <<'PY'
          from changerisk.webassets import web_dir
          root = web_dir()
          assert (root / "index.html").is_file(), root
          print("dashboard files found in", root)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
