  <style>
/*
  Design tokens. Graphite and chalk neutrals; colour is reserved for risk.
  Layout concept: a faceplate band on top, a history rail on the left, and one column of
  evidence that reads top to bottom (answer, reasons, tests, files).
*/

:root {
  color-scheme: light;

  /* surfaces */
  --ground: #e9ecee;
  --surface: #f6f8f9;
  --well: #e0e5e8;
  --raised: #ffffff;

  /* ink */
  --ink: #12171b;
  --ink-2: #444c53;
  --ink-3: #66707a;
  --line: #cfd6db;
  --line-strong: #aeb8bf;
  --on-ink: #f6f8f9;

  /* faceplate band */
  --bar-bg: #12171b;
  --bar-ink: #f1f4f5;
  --bar-ink-2: #a9b3ba;
  --bar-line: #2c353b;
  --bar-notch: #fab219;

  /* risk levels: fixed, always paired with a shape and a word */
  --st-low: #0ca30c;
  --st-moderate: #fab219;
  --st-high: #ec835a;
  --st-critical: #d03b3b;
  --tint-low: color-mix(in oklab, var(--st-low) 20%, var(--surface));
  --tint-moderate: color-mix(in oklab, var(--st-moderate) 26%, var(--surface));
  --tint-high: color-mix(in oklab, var(--st-high) 24%, var(--surface));
  --tint-critical: color-mix(in oklab, var(--st-critical) 18%, var(--surface));

  /* diff */
  --add-bg: color-mix(in oklab, #2f9e5b 13%, var(--surface));
  --add-mark: #1f7a45;
  --del-bg: color-mix(in oklab, #c4453f 12%, var(--surface));
  --del-mark: #a9362f;
  --flag-bg: color-mix(in oklab, var(--st-moderate) 12%, var(--surface));

  /* type */
  --font: Bahnschrift, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-narrow: "Bahnschrift SemiCondensed", Bahnschrift, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --mono: "Cascadia Mono", "JetBrains Mono", "SF Mono", Consolas, ui-monospace, "Liberation Mono", monospace;

  --fs-xs: 0.72rem;   /* 11.5px: uppercase labels */
  --fs-sm: 0.78rem;   /* 12.5px */
  --fs-md: 0.875rem;  /* 14px */
  --fs-lg: 1rem;
  --fs-xl: 1.25rem;
  --fs-2xl: 1.75rem;
  --fs-hero: 5.5rem;  /* 88px */

  /* space and shape */
  --gap-1: 4px;
  --gap-2: 8px;
  --gap-3: 12px;
  --gap-4: 16px;
  --gap-5: 24px;
  --gap-6: 32px;
  --gap-7: 48px;
  --radius: 3px;
  --radius-lg: 6px;
  --rail-w: 252px;
  --main-w: 60rem;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --shadow-pop: 0 6px 24px rgba(10, 16, 20, 0.18), 0 0 0 1px var(--line);

  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0f1316;
    --surface: #171c20;
    --well: #1f262b;
    --raised: #1b2125;
    --ink: #e8edf0;
    --ink-2: #b2bbc1;
    --ink-3: #8a949b;
    --line: #2b343a;
    --line-strong: #3d4850;
    --on-ink: #0f1316;
    --bar-bg: #0a0d0f;
    --bar-line: #242c31;
    --add-bg: color-mix(in oklab, #2f9e5b 17%, var(--surface));
    --add-mark: #5fcf8b;
    --del-bg: color-mix(in oklab, #c4453f 19%, var(--surface));
    --del-mark: #f08a83;
    --tint-low: color-mix(in oklab, var(--st-low) 24%, var(--surface));
    --tint-moderate: color-mix(in oklab, var(--st-moderate) 24%, var(--surface));
    --tint-high: color-mix(in oklab, var(--st-high) 26%, var(--surface));
    --tint-critical: color-mix(in oklab, var(--st-critical) 30%, var(--surface));
    --shadow-pop: 0 8px 28px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--line);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0f1316;
  --surface: #171c20;
  --well: #1f262b;
  --raised: #1b2125;
  --ink: #e8edf0;
  --ink-2: #b2bbc1;
  --ink-3: #8a949b;
  --line: #2b343a;
  --line-strong: #3d4850;
  --on-ink: #0f1316;
  --bar-bg: #0a0d0f;
  --bar-line: #242c31;
  --add-bg: color-mix(in oklab, #2f9e5b 17%, var(--surface));
  --add-mark: #5fcf8b;
  --del-bg: color-mix(in oklab, #c4453f 19%, var(--surface));
  --del-mark: #f08a83;
  --tint-low: color-mix(in oklab, var(--st-low) 24%, var(--surface));
  --tint-moderate: color-mix(in oklab, var(--st-moderate) 24%, var(--surface));
  --tint-high: color-mix(in oklab, var(--st-high) 26%, var(--surface));
  --tint-critical: color-mix(in oklab, var(--st-critical) 30%, var(--surface));
  --shadow-pop: 0 8px 28px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--line);
}

/* Level helpers: set --st and --tint from a data attribute, so components stay generic. */
[data-level="low"] { --st: var(--st-low); --tint: var(--tint-low); }
[data-level="moderate"] { --st: var(--st-moderate); --tint: var(--tint-moderate); }
[data-level="high"] { --st: var(--st-high); --tint: var(--tint-high); }
[data-level="critical"] { --st: var(--st-critical); --tint: var(--tint-critical); }

</style>
  <style>
*,
*::before,
*::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-padding-top: 72px;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--ground);
  color: var(--ink);
  font: 400 var(--fs-md) / 1.5 var(--font);
  font-feature-settings: "kern", "liga";
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}

h1, h2, h3, h4, p, ul, ol, dl, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
h1, h2, h3 { text-wrap: balance; font-weight: 600; letter-spacing: 0.005em; }
p { text-wrap: pretty; }

a { color: inherit; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }

code, kbd, samp, pre, .mono { font-family: var(--mono); font-size: 0.92em; }

svg { display: block; }

:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
  border-radius: 2px;
}
.bar :focus-visible { outline-color: var(--bar-ink); }

::selection { background: color-mix(in oklab, var(--st-moderate) 45%, transparent); }

.visually-hidden {
  position: absolute !important;
  width: 1px; height: 1px;
  margin: -1px; padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  left: 8px; top: -48px;
  z-index: 100;
  padding: 8px 12px;
  background: var(--ink);
  color: var(--on-ink);
  border-radius: var(--radius);
}
.skip-link:focus { top: 8px; }

.eyebrow {
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.num { font-variant-numeric: tabular-nums; }
.dim { color: var(--ink-3); }
.noscript { padding: var(--gap-5); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

</style>
  <style>
/* Faceplate band ----------------------------------------------------------- */

.bar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 40;
  background: var(--bar-bg);
  color: var(--bar-ink);
  border-bottom: 1px solid var(--bar-line);
}
.bar-inner {
  display: flex;
  align-items: center;
  gap: var(--gap-5);
  min-height: 48px;
  padding-inline: max(var(--gutter), env(safe-area-inset-right, 0px));
  max-width: calc(var(--rail-w) + var(--main-w) + 2 * var(--gap-5) + 2 * var(--gutter));
  margin-inline: auto;
}
.wordmark {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--bar-ink);
}
.wordmark-text {
  font-family: var(--font-narrow);
  font-size: 1.08rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.tabs { display: flex; gap: 2px; align-self: stretch; }
.tab {
  display: inline-flex;
  align-items: center;
  padding-inline: var(--gap-3);
  color: var(--bar-ink-2);
  text-decoration: none;
  font-size: var(--fs-md);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tab:hover { color: var(--bar-ink); }
.tab[aria-current="page"] { color: var(--bar-ink); border-bottom-color: var(--bar-notch); }
.bar-end { margin-left: auto; display: flex; align-items: center; gap: var(--gap-3); }
.bar-repo {
  font-family: var(--mono);
  font-size: var(--fs-sm);
  color: var(--bar-ink-2);
  max-width: 28ch;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* App shell ---------------------------------------------------------------- */

.app {
  max-width: calc(var(--rail-w) + var(--main-w) + 2 * var(--gap-5) + 2 * var(--gutter));
  margin-inline: auto;
  padding-inline: max(var(--gutter), env(safe-area-inset-right, 0px));
  padding-block: var(--gap-4) var(--gap-7);
}
.shell {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  gap: var(--gap-5);
  align-items: start;
  margin-top: var(--gap-4);
}
.main { min-width: 0; display: grid; gap: var(--gap-5); outline: none; }
.rail {
  position: sticky;
  top: 64px;
  max-height: calc(100vh - 80px);
  overflow: auto;
  min-width: 0;
}
body[data-view="history"] .shell,
body[data-view="rules"] .shell { grid-template-columns: minmax(0, 1fr); }
body[data-view="history"] .rail,
body[data-view="rules"] .rail { display: none; }
body[data-static] .toolbar,
body[data-static] .rail { display: none; }
body[data-static] .shell { grid-template-columns: minmax(0, 1fr); }
body[data-static] .app { max-width: calc(var(--main-w) + 2 * var(--gutter)); }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; order: 2; }
  .bar-repo { display: none; }
  .bar-inner { gap: var(--gap-3); }
}
@media (max-width: 520px) {
  .wordmark-text { display: none; }
  .bar-inner { gap: var(--gap-2); }
  .tab { padding-inline: 8px; }
  .theme-btn { width: 28px; }
}

.live { position: absolute; left: -9999px; }

body[data-view="history"] .toolbar,
body[data-view="rules"] .toolbar { display: none; }

</style>
  <style>
/* Buttons ------------------------------------------------------------------ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 32px;
  padding: 0 var(--gap-3);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: var(--raised);
  color: var(--ink);
  font-size: 0.82rem;
  font-weight: 500;
  line-height: 1;
  text-decoration: none;
  white-space: nowrap;
  list-style: none;
}
.btn::-webkit-details-marker { display: none; }
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: 0.55; }
.btn-primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn-primary:hover:not(:disabled) { background: color-mix(in oklab, var(--ink) 86%, var(--surface)); }
.btn-quiet { background: transparent; border-color: transparent; color: var(--ink-2); padding-inline: 6px; }
.btn-quiet:hover:not(:disabled) { color: var(--ink); border-color: var(--line-strong); }
.icon { flex: none; }
.btn .icon:last-child:not(:first-child) { margin-left: -2px; }

/* Form controls ------------------------------------------------------------- */

.field { display: grid; gap: 4px; min-width: 0; }
.field > label,
.field > .label {
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-3);
}
select,
input[type="search"],
input[type="text"] {
  min-height: 32px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background-color: var(--raised);
  color: var(--ink);
  padding: 0 10px;
  font-size: 0.82rem;
  min-width: 0;
}
select {
  appearance: none;
  padding-right: 30px;
  max-width: 100%;
  background-image:
    linear-gradient(45deg, transparent 50%, var(--ink-2) 50%),
    linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
select:disabled { opacity: 0.5; }
select:hover:not(:disabled), input[type="search"]:hover { border-color: var(--ink); }

.check { display: inline-flex; align-items: center; gap: 8px; font-size: 0.82rem; color: var(--ink-2); cursor: pointer; }
input[type="checkbox"] { accent-color: var(--ink); width: 15px; height: 15px; margin: 0; }
input[type="radio"] { accent-color: var(--ink); }

.segmented { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--radius); background: var(--raised); overflow: hidden; }
.seg { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 0 12px; line-height: 30px; font-size: 0.82rem; color: var(--ink-2); white-space: nowrap; }
.seg + .seg span { border-left: 1px solid var(--line); }
.seg input:checked + span { background: var(--ink); color: var(--on-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: -3px; }

/* Toolbar -------------------------------------------------------------------- */

.toolbar {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: var(--gap-3) var(--gap-4);
}
.toolbar-summary { display: none; }
.toolbar-form { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--gap-3) var(--gap-3); }
.toolbar-form .field select { min-width: 11rem; }
.field-join { align-self: end; padding-bottom: 5px; color: var(--ink-3); }
.toolbar-form .btn-primary { margin-left: auto; min-width: 104px; }
.toolbar-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--gap-1) var(--gap-4); margin-top: var(--gap-3); padding-top: var(--gap-2); border-top: 1px solid var(--line); }
.toolbar-hint { font-size: var(--fs-sm); color: var(--ink-3); max-width: 62ch; }
.toolbar-foot .check { font-size: var(--fs-sm); }
.form-error {
  display: flex; gap: 8px; align-items: center;
  margin-top: var(--gap-2);
  padding: 8px 12px;
  background: var(--tint-critical);
  border: 1px solid var(--st-critical);
  border-radius: var(--radius);
  font-size: 0.82rem;
}
.form-error .icon { color: var(--st-critical); }

@media (max-width: 700px) {
  .toolbar-summary {
    display: flex; justify-content: space-between; align-items: center;
    font-weight: 600; font-size: 0.9rem; padding: 2px 0;
  }
  .toolbar-details[open] > .toolbar-summary { margin-bottom: var(--gap-3); }
  .toolbar-details[open] > .toolbar-summary .icon { transform: rotate(180deg); }
  .toolbar-form .field { flex: 1 1 100%; }
  .toolbar-form .field select { width: 100%; }
  .field-join { display: none; }
  .toolbar-form .btn-primary { margin-left: 0; flex: 1 1 100%; }
}

/* Theme switch ---------------------------------------------------------------- */

.theme-switch { display: inline-flex; border: 1px solid var(--bar-line); border-radius: var(--radius); overflow: hidden; }
.theme-btn { display: grid; place-items: center; width: 30px; height: 28px; background: transparent; border: 0; color: var(--bar-ink-2); }
.theme-btn + .theme-btn { border-left: 1px solid var(--bar-line); }
.theme-btn:hover { color: var(--bar-ink); }
.theme-btn[aria-pressed="true"] { background: var(--bar-ink); color: var(--bar-bg); }

/* Panels ----------------------------------------------------------------------- */

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: var(--gap-5);
  min-width: 0;
}
.panel-head { margin-bottom: var(--gap-4); }
.panel-head h2, .panel-head .h2, .h2 { font-size: var(--fs-xl); line-height: 1.25; }
.panel-sub { margin-top: 4px; color: var(--ink-2); font-size: 0.82rem; max-width: 70ch; }
.panel-head-split { display: flex; justify-content: space-between; gap: var(--gap-4); align-items: flex-start; flex-wrap: wrap; }
.stack { display: grid; gap: var(--gap-5); }
.duo { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: var(--gap-5); align-items: start; }
.duo > :only-child { grid-column: 1 / -1; }
@media (max-width: 760px) { .duo { grid-template-columns: minmax(0, 1fr); } }
.empty { color: var(--ink-2); max-width: 64ch; }
.empty-state { display: grid; gap: var(--gap-3); justify-items: start; }
.small { font-size: var(--fs-sm); }
.nowrap { white-space: nowrap; }
.is-loading > * { opacity: 0.55; transition: opacity 120ms; }

/* Chips -------------------------------------------------------------------------- */

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--gap-3); }
.chip {
  display: inline-flex; align-items: baseline; gap: 6px;
  padding: 3px 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink-2);
  font-size: 0.8rem;
}
.chip:hover { border-color: var(--ink); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--on-ink); }
.chip-n { font-size: var(--fs-xs); opacity: 0.8; }

/* Details / disclosure ------------------------------------------------------------ */

summary { cursor: pointer; list-style: none; }
summary::-webkit-details-marker { display: none; }

.more > summary,
.how > summary,
.twin > summary {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--ink-2); font-size: 0.82rem;
}
.more > summary::before,
.how > summary::before {
  content: "";
  width: 6px; height: 6px;
  border-right: 1.5px solid currentColor;
  border-bottom: 1.5px solid currentColor;
  transform: rotate(-45deg);
  transition: transform 120ms;
  margin-right: 2px;
}
.more[open] > summary::before,
.how[open] > summary::before { transform: rotate(45deg); }
.more > summary:hover, .how > summary:hover, .twin > summary:hover { color: var(--ink); }

/* Menu ------------------------------------------------------------------------------ */

.menu { position: relative; }
.menu-pop {
  position: absolute; right: 0; top: calc(100% + 4px); z-index: 20;
  min-width: 15rem;
  display: grid;
  background: var(--raised);
  border-radius: var(--radius);
  box-shadow: var(--shadow-pop);
  padding: 4px;
}
.menu-item { padding: 8px 10px; border-radius: 2px; text-decoration: none; font-size: 0.82rem; }
.menu-item:hover { background: var(--well); }

/* Tables ----------------------------------------------------------------------------- */

.table-wrap { overflow-x: auto; }
.plain-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.plain-table th, .plain-table td { text-align: left; padding: 8px 12px 8px 0; border-top: 1px solid var(--line); vertical-align: top; font-weight: 400; }
.plain-table thead th { border-top: 0; font-size: var(--fs-xs); letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.plain-table tbody th { font-weight: 500; }
.plain-table .r { text-align: right; font-variant-numeric: tabular-nums; }
.twin { margin-top: var(--gap-3); }
.twin[open] > summary { margin-bottom: var(--gap-2); }
.level-cell { display: inline-flex; align-items: center; gap: 8px; }

/* Tooltip ------------------------------------------------------------------------------ */

.tip {
  position: fixed; z-index: 60;
  left: var(--tip-x, 0); top: var(--tip-y, 0);
  max-width: 22rem;
  padding: 8px 10px;
  background: var(--ink); color: var(--on-ink);
  border-radius: var(--radius);
  font-size: var(--fs-sm); line-height: 1.4;
  pointer-events: none;
}
.tip strong { font-weight: 600; }
.tip-dim { opacity: 0.72; }

/* Shapes ---------------------------------------------------------------------------------- */

.shape { flex: none; }
.shape polygon, .shape circle {
  fill: var(--st);
  stroke: color-mix(in oklab, var(--st) 55%, var(--ink));
  stroke-width: 0.9;
  stroke-linejoin: round;
}

/* Rail -------------------------------------------------------------------------------------- */

.rail-head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 var(--gap-1) var(--gap-2); }
.rail-list { display: grid; gap: 2px; }
.rail-li { position: relative; display: flex; align-items: center; border-radius: var(--radius); }

      super(message);
      this.status = status;

  }

  async function request(method, path, body) {
    const options = { method, headers: { Accept: 'application/json' } };
    if (body !== undefined) {
      options.headers['Content-Type'] = 'application/json';
      options.body = JSON.stringify(body);
    }
    let response;
    try {
      response = await fetch(path, options);
    } catch {
      throw new ApiError('Could not reach the ChangeRisk server. Is it still running?', 0);
    }
    let data = null;
    try {
      data = await response.json();
    } catch {
      // an empty or non-JSON body is handled below by status
    }
    if (!response.ok) {
      throw new ApiError((data && data.error) || `The server answered ${response.status}.`, response.status);
    }
    return data;
  }

  const api = {
    repo: () => request('GET', '/api/repo'),
    rules: () => request('GET', '/api/rules'),
    reports: () => request('GET', '/api/reports'),
    report: (id) => request('GET', `/api/reports/${encodeURIComponent(id)}`),
    analyze: (payload) => request('POST', '/api/analyze', payload),
    remove: (id) => request('DELETE', `/api/reports/${encodeURIComponent(id)}`),
    exportUrl: (id, format) => `/api/reports/${encodeURIComponent(id)}/export?format=${format}`,
  };

  async function fetchText(url) {
    let response;
    try {
      response = await fetch(url);
    } catch {
      throw new ApiError('Could not reach the ChangeRisk server.', 0);
    }
    if (!response.ok) throw new ApiError(`The server answered ${response.status}.`, response.status);
    return response.text();
  }
  return { ApiError, api, fetchText };
})();

const __m_js_store_js = (() => {
  function createStore(initial) {
    let state = initial;

      get: () => state,
      set(patch) {
        state = { ...state, ...patch };
        for (const fn of listeners) fn(state);
      },
      subscribe(fn) {
        listeners.add(fn);
        return () => listeners.delete(fn);
      },
    };
  }

  // localStorage can be missing or throw (private windows, blocked storage). Everything built
  // on it is a convenience, so failures are swallowed and the page works without it.
  function remember(key, value) {
    try {
      if (value === undefined) localStorage.removeItem(key);
      else localStorage.setItem(key, JSON.stringify(value));
    } catch {
      // ignore
    }
  }

  function recall(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw === null ? fallback : JSON.parse(raw);
    } catch {
      return fallback;
    }
  }
  return { createStore, remember, recall };
})();

    moderate: 'Moderate',
    high: 'High',
    critical: 'Critical',
  };

    { id: 'moderate', from: 25, to: 50 },
    { id: 'high', from: 50, to: 75 },
    { id: 'critical', from: 75, to: 100 },
  ];

    let level = 'low';
    for (const band of BANDS) if (score >= band.from) level = band.id;
    return level;
  }

  const SEVERITY_LEVEL = {
    info: 'low',
    low: 'low',
    medium: 'moderate',
    high: 'high',
    critical: 'critical',
  };

  const SEVERITY_LABEL = {
    info: 'Info',
    low: 'Low',
    medium: 'Medium',
    high: 'High',
    critical: 'Critical',
  };

  const STATUS_LETTER = {
    added: 'A',
    modified: 'M',
    deleted: 'D',
    renamed: 'R',
    copied: 'C',
    typechange: 'T',
  };

  const STATUS_LABEL = {
    added: 'Added',
    modified: 'Modified',
    deleted: 'Deleted',
    renamed: 'Renamed',
    copied: 'Copied',
    typechange: 'Type changed',
  };

  const PRIORITY_GROUPS = [
    { priority: 1, title: 'Before merging', hint: 'Tied to high and critical findings' },
    { priority: 2, title: 'Should do', hint: 'Tied to medium findings' },
    { priority: 3, title: 'If there is time', hint: 'Tied to low findings' },
  ];

  function groupPlan(steps) {

      .map((g) => ({ ...g, steps: steps.filter((s) => s.priority === g.priority) }))
      .filter((g) => g.steps.length > 0);

})();

  }

    const n = Number(p) || 0;

  function plural(n, one, many) {
    return `${fmtInt(n)} ${n === 1 ? one : (many || `${one}s`)}`;

  }

    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '';
    const sameYear = d.getFullYear() === now.getFullYear();
    return new Intl.DateTimeFormat('en', {
      day: 'numeric',
      month: 'short',
      ...(sameYear ? {} : { year: 'numeric' }),
    }).format(d);

    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '';
    return new Intl.DateTimeFormat('en', { dateStyle: 'medium', timeStyle: 'short' }).format(d);

    const t = Date.parse(iso);
    if (Number.isNaN(t)) return '';

    if (seconds < 45) return 'just now';
    const minutes = Math.round(seconds / 60);
    if (minutes < 60) return `${minutes} min ago`;
    const hours = Math.round(minutes / 60);
    if (hours < 24) return `${hours} h ago`;
    const days = Math.round(hours / 24);
    if (days === 1) return 'yesterday';
    if (days < 14) return `${days} days ago`;

      await refreshReports();
      store.set({ busy: false, report, reportId: report.id });
      announce(`Analysis finished: ${LEVEL_LABEL[report.level]} risk, score ${report.score}.`);
      if (location.hash === `#/r/${report.id}`) await route();
      else location.hash = `#/r/${report.id}`;
    } catch (error) {
      store.set({ busy: false, error: error.message });
      renderToolbarOnly();
      announce(`Analysis failed. ${error.message}`);
    }
  }

  async function remove(id) {
    try {
      await api.remove(id);
    } catch (error) {
      store.set({ error: error.message });
    }
    const reports = await refreshReports();
    if (store.get().reportId === id) {
      store.set({ report: null, reportId: null });
      location.hash = reports[0] ? `#/r/${reports[0].id}` : '#/';
      await route();
    } else {
      renderRailOnly();
    }
  }

  // --- rendering ---------------------------------------------------------------

  function renderNav() {
    const { view } = store.get();
    const tabs = STATIC ? [['report', 'Report', '#/']] : [['report', 'Report', '#/'], ['history', 'History', '#/history'], ['rules', 'Rules', '#/rules']];
    mount(el.nav, tabs.map(([id, label, href]) => h('a', { class: 'tab', href, 'aria-current': view === id ? 'page' : null }, label)));
  }

  function renderBar() {
    const { repo, report } = store.get();
    const name = repo ? repo.name : report ? report.repo : '';
    mount(el.barEnd, name ? h('span', { class: 'bar-repo', title: repo ? repo.path : name }, name, repo && repo.branch ? ` @ ${repo.branch}` : '') : null, themeSwitch());
  }

  function renderToolbarOnly() {
    const { repo, busy, error } = store.get();
    if (!repo || STATIC) return;
    renderToolbar(el.toolbar, { repo, busy, error, onAnalyze: analyze });
  }

  function renderRailOnly() {
    if (STATIC) return;
    const { reports, reportId } = store.get();
    renderRail(el.rail, { reports, selectedId: reportId, onDelete: remove });
  }

  function emptyState() {
    const { repo } = store.get();
    const base = repo && repo.default_base;
    const head = repo && (repo.branch || 'HEAD');
    const can = repo && repo.has_commits && base && base !== head;
    return h(
      'section',
      { class: 'panel empty-state' },
      h('h1', { class: 'h2' }, 'Nothing analysed yet'),
      h('p', null, 'ChangeRisk compares a branch with the one it will merge into, scores the difference, and lists what to test because of it.'),
      can
        ? h('button', { type: 'button', class: 'btn btn-primary', onClick: () => analyze({ mode: 'range', base, head: 'HEAD', history: true }) }, `Analyse ${head} against ${base}`)
        : h('p', { class: 'dim' }, 'Pick two refs above and press Analyse, or analyse staged changes.'),
      h('p', { class: 'dim small' }, 'From a terminal: ', h('code', null, 'changerisk analyze --base main')),
    );
  }

  function reportView(report) {
    const { reports } = store.get();
    const failOn = report.gate.fail_on;
    const select = (id) => { location.hash = `#/r/${id}`; };
    return [
      changeHeader(report, { onRerun: STATIC ? null : () => analyze(report.range.mode === 'range' ? { mode: 'range', base: report.range.base, head: report.range.head, history: true } : { mode: report.range.mode, history: true }), canExport: !STATIC }),
      verdictPanel(report),
      reasonsSection(report),
      planSection(report),
      h('div', { class: 'duo' }, breakdownPanel(report), STATIC ? null : trendPanel({ reports, selectedId: report.id, failOn, onSelect: select })),
      filesSection(report),
      commitsPanel(report),
      h('footer', { class: 'colophon' }, `ChangeRisk ${report.tool_version}. Generated ${new Date(report.generated_at).toLocaleString()}.`),
    ];
  }

  function renderMain() {
    const s = store.get();
    el.main.classList.toggle('is-loading', s.loading);
    document.title = 'ChangeRisk';
    if (s.view === 'history') {
      mount(el.main, historyView({ reports: s.reports, failOn: s.repo && s.report ? s.report.gate.fail_on : 'high', onSelect: (id) => { location.hash = `#/r/${id}`; } }));
      return;
    }
    if (s.view === 'rules') {
      mount(el.main, s.rules ? rulesView(s.rules) : h('p', { class: 'empty' }, s.loadError || 'Loading rules…'));
      return;
    }
    if (s.loadError) {
      mount(el.main, h('section', { class: 'panel' }, h('h1', { class: 'h2' }, 'That analysis could not be opened'), h('p', null, s.loadError), h('a', { class: 'btn', href: '#/' }, 'Back to the latest')));
      return;
    }
    if (!s.report) {
      mount(el.main, s.loading ? h('p', { class: 'empty' }, 'Loading…') : emptyState());
      return;
    }
    document.title = `${LEVEL_LABEL[s.report.level]} risk (${s.report.score}) · ${s.report.range.head} · ChangeRisk`;
    mount(el.main, reportView(s.report));
  }

  function renderAll() {
    renderBar();
    renderToolbarOnly();
    renderRailOnly();
    renderMain();
  }

  // --- start -------------------------------------------------------------------

  async function start() {
    applyTheme(currentTheme());
    if (STATIC) {
      document.body.dataset.static = '';
      store.set({ report: boot.report, reportId: boot.report.id || null });
      renderNav();
      renderAll();
      return;
    }
    try {
      const [repo, list] = await Promise.all([api.repo(), api.reports()]);
      store.set({ repo, reports: list.reports });
    } catch (error) {
      mount(el.main, h('section', { class: 'panel' }, h('h1', { class: 'h2' }, 'The dashboard cannot reach its server'), h('p', null, error.message)));
      return;
    }
    window.addEventListener('hashchange', () => route());
    await route(true);
  }

  start();
})();
</script>
</body>
</html>
