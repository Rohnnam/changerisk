[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changerisk"
version = "0.2.0"
description = "Reads a code change, scores how risky it is, and lists what to test because of it."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["git", "code review", "risk", "ci", "github actions"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
]

[project.scripts]
changerisk = "changerisk.cli:main"

[tool.setuptools]
package-dir = { "" = "src", "changerisk.web" = "frontend" }
packages = [
    "changerisk",
    "changerisk.rules",
    "changerisk.reports",
    "changerisk.web",
]

[tool.setuptools.package-data]
"changerisk.web" = ["*.html", "css/*.css", "js/*.js", "js/views/*.js", "img/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"
filterwarnings = ["error"]
markers = [
    "slow: tests that start a server or build a wheel",
]

[tool.coverage.run]
source = ["changerisk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["examples", "build", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET"]
# E501: `ruff format` owns line length; what it cannot wrap is prose in rule descriptions and regexes.
ignore = ["E501", "RET504", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
